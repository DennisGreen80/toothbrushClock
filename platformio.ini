; Toothbrush timer – built with pioarduino (https://github.com/pioarduino/platform-espressif32),
; the community fork of PlatformIO's espressif32 platform. Release 61.04.00 ships ESP-IDF 6.1.1.
;
;   pio run -e waveshare_28c                   build
;   pio run -e waveshare_28c -t upload         flash via the USB-C "UART" port
;   pio run -e waveshare_28c -t menuconfig     "Toothbrush timer" display options
;   pio device monitor -e waveshare_28c        serial log
;   pio test -e native                         host unit tests for lib/brush_core
;
; It is a regular ESP-IDF project, so `idf.py build` works as well.

[platformio]
default_envs = waveshare_28c
; The ESP-IDF "main" component; main/CMakeLists.txt compiles the sources in src/.
src_dir = main

[env:waveshare_28c]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00/platform-espressif32.zip
framework = espidf
; ESP32-S3 with 16 MB QIO flash and 8 MB octal PSRAM, like the Waveshare 2.8C.
board = esp32-s3-devkitc1-n16r8
board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; lib/brush_core is an ESP-IDF component (EXTRA_COMPONENT_DIRS in CMakeLists.txt); keep the
; PlatformIO library finder from building it a second time. Don't use lib_ignore for this:
; pioarduino maps lib_ignore entries to IDF components and would drop it from the build.
lib_ldf_mode = off

[env:native]
platform = native
test_framework = unity
build_flags = -std=c99 -Wall -Wextra -lm
