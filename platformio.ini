; Toothbrush timer for the Waveshare ESP32-S3-Touch-LCD-2.8C (round 480x480, ST7701 + GT911)
;
;   pio run -e waveshare_28c -t upload      build + flash
;   pio device monitor                       serial log
;   pio test -e native                       host unit tests for lib/brush_core

[platformio]
default_envs = waveshare_28c

[env:waveshare_28c]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; 16 MB flash, 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -I include
    -I src
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    lvgl/lvgl@~8.3.11
    h2zero/NimBLE-Arduino@~1.4.2

[env:native]
platform = native
test_framework = unity
build_flags = -std=c99 -Wall -Wextra -lm
